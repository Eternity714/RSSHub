name: 'Delete Public GHCR Package'

on:
    workflow_dispatch:
        inputs:
            confirmation:
                description: 'Enter DELETE_PUBLIC_RSSHUB_PACKAGE to confirm deletion.'
                required: true
                type: string

jobs:
    delete:
        runs-on: ubuntu-slim
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Confirm package deletion
              env:
                  CONFIRMATION: ${{ inputs.confirmation }}
              run: test "$CONFIRMATION" = 'DELETE_PUBLIC_RSSHUB_PACKAGE'

            - name: Delete public container package
              env:
                  GH_TOKEN: ${{ secrets.GHCR_DELETE_TOKEN }}
              run: gh api --method DELETE '/user/packages/container/rsshub'
